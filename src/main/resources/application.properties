spring.application.name=tm-kolkata-backend
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4173,http://localhost:3000,https://somalrudra.github.io}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:tmkolkata;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
