spring.application.name=tm-kolkata-backend
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4173,http://localhost:3000,https://somalrudra.github.io}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:tmkolkata;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.frontend.reset-url=${FRONTEND_RESET_URL:https://somalrudra.github.io/tm-kolkata-analytics-funnel/reset-password/}
app.auth.admin-username=${ADMIN_USERNAME:admin}
app.auth.admin-email=${ADMIN_EMAIL:tmbengal108@gmail.com}
app.auth.admin-password=${ADMIN_PASSWORD:admin}
app.auth.access-token-minutes=${ACCESS_TOKEN_MINUTES:15}
app.auth.refresh-token-days=${REFRESH_TOKEN_DAYS:30}
app.auth.reset-token-minutes=${RESET_TOKEN_MINUTES:30}
app.auth.include-reset-link-in-response=${INCLUDE_RESET_LINK_IN_RESPONSE:false}
app.email.resend-api-key=${RESEND_API_KEY:}
app.email.resend-from-email=${RESEND_FROM_EMAIL:TM Kolkata <onboarding@resend.dev>}
app.email.resend-api-url=${RESEND_API_URL:https://api.resend.com/emails}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:5000}
